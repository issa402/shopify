[options]
; Development-only master password for creating/restoring local Odoo databases.
; Change this before any shared or public deployment.
admin_passwd = admin_dev_change_me

; The official Docker image also receives HOST/USER/PASSWORD env vars.
db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo_dev_password

; Pin this local dev stack to the initialized store database.
dbfilter = ^pokecard_store$
list_db = True

; Load Odoo core addons plus this repo's custom storefront addons.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

data_dir = /var/lib/odoo
proxy_mode = False
workers = 0
max_cron_threads = 1
log_level = info
